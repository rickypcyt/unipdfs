<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apuntes</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --border: #d9dee7;
      --accent: #155eef;
      --accent-soft: #eef4ff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .app { --aside-w: 420px; }

    aside {
      width: var(--aside-w);
      flex: 0 0 var(--aside-w);
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 20px;
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .app.panel-closed aside,
    .app.panel-closed .resizer {
      display: none;
    }

    /* Borde arrastrable entre la barra lateral y el visor */
    .resizer {
      position: relative;
      flex: 0 0 6px;
      margin-left: -3px;
      cursor: col-resize;
      z-index: 20;
    }
    .resizer::after {
      content: "";
      position: absolute;
      inset: 0 2px;
      background: transparent;
      transition: background .12s;
    }
    .resizer:hover::after,
    .app.resizing .resizer::after { background: var(--accent); }
    .app.resizing { cursor: col-resize; user-select: none; }
    .app.resizing iframe { pointer-events: none; }

    main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #e9edf2;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .mode-notice {
      margin: 0 0 14px;
      padding: 10px 12px;
      border: 1px solid #f5d78e;
      border-radius: 8px;
      background: #fff8e6;
      color: #7a5b00;
      font-size: 13px;
      line-height: 1.4;
    }

    .source-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .source-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; color: var(--muted); font-size: 12px; }
    .source-row button { padding: 6px 10px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; cursor: pointer; }
    .welcome { padding: 14px; border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .subject-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .subject-row select { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-weight: 700; background: #fff; color: var(--text); }
    .subject-row button { padding: 0 14px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 18px; cursor: pointer; }
    .subject-row button:hover { border-color: var(--accent); }

    .search {
      width: 100%;
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }

    /* Asignaturas y temas como tarjetas */
    .tree-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .tree-head .tree-actions { display: flex; gap: 6px; }
    .tree-head button { min-width: 32px; height: 30px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text); font-size: 15px; cursor: pointer; }
    .tree-head button:hover { border-color: var(--accent); color: var(--accent); }

    .extract-status { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: #eef4ff; color: #1849a9; font-size: 12px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .extract-status.warn { background: #fff8e6; color: #7a5b00; }
    .extract-status.failed { white-space: normal; }
    .extract-status ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .extract-status li { padding: 8px 10px; border: 1px solid #f5d78e; border-radius: 8px; background: #fffdf5; }
    .fail-name { font-weight: 700; overflow-wrap: anywhere; }
    .fail-where { color: #a07a00; font-size: 11px; }
    .fail-why { margin: 4px 0 6px; color: #5c4500; overflow-wrap: anywhere; }
    .extract-status li button { padding: 4px 10px; border: 1px solid #d9a400; border-radius: 6px; background: #fff; color: #7a5b00; font-size: 12px; font-weight: 700; cursor: pointer; }
    .extract-status li button:disabled { opacity: .6; cursor: default; }

    .pdf-list { display: grid; gap: 10px; }
    .folder-node { display: grid; gap: 8px; }

    .folder-toggle {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; color: var(--text); font-size: 14px; font-weight: 700; text-align: left; cursor: pointer;
    }
    .folder-toggle:hover { border-color: var(--accent); }
    .pdf-list > .folder-node > .folder-toggle { background: #f8fafc; font-size: 15px; font-weight: 800; }

    .folder-arrow {
      flex-shrink: 0; width: 0; height: 0;
      border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 7px solid var(--muted);
      transition: transform .15s ease;
    }
    .folder-node:not(.collapsed) > .folder-toggle .folder-arrow { transform: rotate(90deg); }
    .folder-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .folder-count {
      flex-shrink: 0; min-width: 28px; height: 22px; padding: 0 8px; border-radius: 999px;
      background: #eef2f7; color: #344054; font-size: 12px; font-weight: 700; line-height: 22px; text-align: center;
    }
    .folder-children { display: grid; gap: 8px; margin-top: 2px; padding-left: 14px; border-left: 1px solid var(--border); }
    .folder-node.collapsed > .folder-children { display: none; }
    .pdf-list.searching .folder-node.collapsed > .folder-children { display: grid; }

    .pdf-item {
      display: grid; gap: 10px; padding: 12px;
      border: 1px solid var(--border); border-radius: 10px; background: #fff;
      transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .pdf-item:hover { border-color: #b2c5ff; }
    .pdf-item.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }

    .card-top { display: flex; align-items: flex-start; gap: 8px; }
    .pdf-open { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; color: inherit; text-decoration: none; cursor: pointer; }
    .pdf-name { font-size: 14px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    .pdf-file { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .file-icon { padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; letter-spacing: .04em; background: #f2f4f7; color: var(--muted); }
    .file-icon.pdf { background: #fef3f2; color: #b42318; }
    .file-icon.md { background: #f4f3ff; color: #5925dc; }
    .file-icon.tex { background: #ecfdf3; color: #027a48; }
    .badge { padding: 1px 6px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge.ok { background: #ecfdf3; color: #027a48; }
    .badge.warn { background: #fffaeb; color: #b54708; }
    .badge.err { background: #fef3f2; color: #b42318; }
    .badge.wait { background: #f2f4f7; color: #667085; }

    .card-tools { display: flex; gap: 4px; flex-shrink: 0; }
    .card-tools button {
      width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; color: var(--muted); font-size: 14px; cursor: pointer;
    }
    .card-tools button:hover { border-color: var(--accent); color: var(--accent); }

    .card-views { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .card-views button {
      padding: 7px 4px; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .card-views button:hover { border-color: var(--accent); color: var(--accent); }
    .card-views button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

    .stats { overflow-x: auto; }
    .stats table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .stats th { padding: 6px 8px; text-align: right; color: #667085; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .stats td { padding: 8px; border-top: 1px solid #eaecf0; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .stats th:first-child, .stats td:first-child { text-align: left; white-space: normal; font-weight: 600; }
    .stats tr.orig td { background: #f8fafc; }
    .stats-note { margin: 12px 0 14px; color: #667085; font-size: 12px; line-height: 1.5; }

    .rename-input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 2px solid var(--accent); border-radius: 8px; font-size: 14px; outline: none; }

    .empty {
      display: none;
      padding: 18px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .panel-toggle {
      flex-shrink: 0;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .panel-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .current-file {
      min-width: 0;
      font-size: 14px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .toolbar a {
      flex-shrink: 0;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .toolbar a:hover {
      text-decoration: underline;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: #fff;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      max-width: 360px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #17202a;
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 10px 30px rgba(16, 24, 40, .18);
    }

    @media (max-width: 820px) {
      .app {
        flex-direction: column;
      }

      .resizer { display: none; }

      aside {
        width: 100%;
        flex: none;
        height: auto;
        max-height: 42vh;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      main {
        flex: 1;
        min-height: 0;
      }
    }
  </style>
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <div class="app">
    <aside>
      <h1>Apuntes</h1>
      <p class="subtitle">Todas tus asignaturas y su temario.</p>
      <p class="mode-notice" id="modeNotice" hidden></p>
      <div class="source-row">
        <span id="rootPath" title="Carpeta fuente">Sin carpeta</span>
        <button type="button" id="pickRoot">Elegir carpeta…</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Buscar en todas las asignaturas...">
      <div class="tree-head">
        <span>Asignaturas</span>
        <span class="tree-actions">
          <button type="button" id="subjectNew" title="Nueva asignatura">+</button>
          <button type="button" id="collapseAll" title="Plegar / desplegar todo">⇅</button>
        </span>
      </div>
      <div class="extract-status" id="extractStatus" hidden></div>
      <div class="pdf-list" id="pdfList"></div>
      <p class="empty" id="empty">No hay archivos con ese filtro.</p>
    </aside>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" title="Arrastra para cambiar el ancho (doble clic: restablecer)"></div>

    <main>
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="panel-toggle" id="panelToggle" type="button" aria-expanded="true" title="Mostrar u ocultar PDFs">PDFs</button>
          <div class="current-file" id="currentFile">Selecciona un PDF de la lista</div>
        </div>
        <a id="openNew" href="#" target="_blank" rel="noopener">Abrir en pestaña nueva</a>
      </div>
      <iframe name="pdfViewer" title="Visor de PDF"></iframe>
    </main>
  </div>

  <script>
    const FALLBACK_FILES = [];

    const app = document.querySelector('.app');
    const panelToggle = document.getElementById('panelToggle');
    const search = document.getElementById('search');
    const empty = document.getElementById('empty');
    const modeNotice = document.getElementById('modeNotice');
    const currentFile = document.getElementById('currentFile');
    const openNew = document.getElementById('openNew');
    const pdfList = document.getElementById('pdfList');
    const viewer = document.querySelector('iframe[name="pdfViewer"]');

    async function postJson(url, body) {
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch (e) { return { ok: false, error: 'El servidor no reconoce ' + url + '. Cierra la ventana de iniciar.bat y vuelve a ejecutarlo (sigue abierta la versión antigua).' }; }
    }

    const rootPath = document.getElementById('rootPath');
    let subjects = [];
    let configured = true;

    document.getElementById('pickRoot').addEventListener('click', async () => {
      if (!apiEnabled) return uiAlert('Ejecuta iniciar.bat y entra por http://localhost:8000');
      rootPath.textContent = 'Eligiendo carpeta…';
      try {
        const r = await postJson('/api/pick-folder');
        if (!r.ok) uiAlert(r.error, 'No se pudo elegir la carpeta');
      } catch (e) { uiAlert(String(e)); }
      loadFiles();
    });

    let folders = [];

    function saveCollapsed() {
      try { localStorage.setItem('collapsed', JSON.stringify([...collapsedFolders])); } catch (e) {}
    }

    document.getElementById('subjectNew').addEventListener('click', async () => {
      if (!apiEnabled) return uiAlert('Ejecuta iniciar.bat para crear asignaturas.');
      const name = await uiPrompt('Nueva asignatura', '', 'Se creará una carpeta con este nombre dentro de tu carpeta fuente.');
      if (!name) return;
      const r = await postJson('/api/subject-new', { name });
      if (!r.ok) return uiAlert(r.error);
      await loadFiles();
    });

    document.getElementById('collapseAll').addEventListener('click', () => {
      const all = [...pdfList.querySelectorAll('.folder-node')].map((n) => n.dataset.path);
      const anyOpen = all.some((p) => !collapsedFolders.has(p));
      collapsedFolders.clear();
      if (anyOpen) all.forEach((p) => collapsedFolders.add(p));
      saveCollapsed();
      render();
    });

    let files = [];
    let apiEnabled = false;
    let currentPath = null;
    const collapsedFolders = new Set((() => {
      try { return JSON.parse(localStorage.getItem('collapsed') || '[]'); } catch (e) { return []; }
    })());

    function pdfUrl(path) {
      return '/files/' + path.split('/').map(encodeURIComponent).join('/') + '#page=1';
    }

    function prettyName(name) {
      return name
        .replace(/\.pdf$/i, '')
        .replace(/_/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function pageLabel(pages) {
      if (!pages) return '';
      return pages === 1 ? '1 página' : pages + ' páginas';
    }

    function folderKey(folder) {
      const value = (folder || '').toLowerCase();
      const tema = value.match(/tema\s*(\d+)/);
      if (tema) return [0, Number(tema[1]), value];
      if (value.includes('parcial') || value.includes('evalu')) return [1, 0, value];
      return [2, 0, value];
    }

    function compareFiles(a, b) {
      const keyA = folderKey(a.folder);
      const keyB = folderKey(b.folder);
      for (let i = 0; i < keyA.length; i += 1) {
        if (keyA[i] < keyB[i]) return -1;
        if (keyA[i] > keyB[i]) return 1;
      }
      return a.name.localeCompare(b.name, 'es', { sensitivity: 'base' });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function countFiles(node) {
      let total = node.files.length;
      node.folders.forEach((child) => {
        total += countFiles(child);
      });
      return total;
    }

    function buildTree(list, folderList = []) {
      const root = { name: '', path: '', folders: new Map(), files: [] };
      folderList.slice().sort((x, y) => compareFiles({ folder: x, name: '' }, { folder: y, name: '' })).forEach((folder) => {
        let node = root;
        folder.split('/').filter(Boolean).forEach((part) => {
          if (!node.folders.has(part)) {
            node.folders.set(part, { name: part, path: node.path ? node.path + '/' + part : part, folders: new Map(), files: [] });
          }
          node = node.folders.get(part);
        });
      });
      list.slice().sort(compareFiles).forEach((file) => {
        const parts = (file.folder || '').split('/').filter(Boolean);
        let node = root;
        parts.forEach((part) => {
          if (!node.folders.has(part)) {
            node.folders.set(part, {
              name: part,
              path: node.path ? node.path + '/' + part : part,
              folders: new Map(),
              files: []
            });
          }
          node = node.folders.get(part);
        });
        node.files.push(file);
      });
      return root;
    }

    function setActive(item, file) {
      document.querySelectorAll('.pdf-item').forEach((entry) => entry.classList.remove('active'));
      item.classList.add('active');
      currentPath = file.path;
      currentFile.textContent = file.name;
      openNew.href = pdfUrl(file.path);
    }

    function renameFile(file, item) {
      if (!apiEnabled) {
        uiAlert('Para renombrar archivos abre la página con iniciar.bat y entra por http://localhost:8000.');
        return;
      }
      const link = item.querySelector('.pdf-open');
      const actions = item.querySelector('.card-tools');
      if (!link || item.querySelector('.rename-input')) return;
      if (actions) actions.style.visibility = 'hidden';

      const input = document.createElement('input');
      input.className = 'rename-input';
      input.value = file.name;
      link.style.display = 'none';
      link.parentNode.insertBefore(input, link);
      input.focus();
      input.setSelectionRange(0, file.name.replace(/\.pdf$/i, '').length);

      let finished = false;
      const close = () => { finished = true; input.remove(); link.style.display = ''; if (actions) actions.style.visibility = ''; };

      const commit = async () => {
        if (finished) return;
        const nextName = input.value.trim();
        if (!nextName || nextName === file.name) return close();
        finished = true;
        input.disabled = true;
        try {
          const data = await postJson('/api/rename', { path: file.path, newName: nextName });
          if (!data.ok) throw new Error(data.error || 'No se pudo renombrar');
          if (currentPath === file.path) {
            currentPath = data.path;
            currentFile.textContent = data.name;
            openNew.href = pdfUrl(data.path);
            if (viewer) viewer.src = pdfUrl(data.path);
          }
          await loadFiles();
        } catch (error) {
          input.remove();
          link.style.display = '';
          if (actions) actions.style.visibility = '';
          uiAlert(error.message, 'Error al renombrar');
        }
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.preventDefault(); close(); }
      });
      input.addEventListener('blur', commit);
      ['click', 'mousedown'].forEach((ev) => input.addEventListener(ev, (e) => e.stopPropagation()));
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 250);
      }, 4000);
    }

    async function extractFile(file) {
      if (!apiEnabled) {
        uiAlert('Para extraer texto e imágenes abre la página con iniciar.bat y entra por http://localhost:8000.');
        return;
      }

      try {
        const response = await fetch('/api/extract?force=1&path=' + encodeURIComponent(file.path), { cache: 'no-store' });
        const data = await response.json();
        if (!data.ok) throw new Error(data.error || 'No se pudo extraer');
        showToast(`Extracción rehecha en ${data.folder} (${data.images} imágenes)`);
        loadFiles();
      } catch (error) {
        uiAlert(error.message, 'Error al extraer');
      }
    }

    function previewFile(file, item) {
      if (!apiEnabled) {
        uiAlert('Para ver la extracción abre la página con iniciar.bat y entra por http://localhost:8000.');
        return;
      }
      const url = '/api/preview?path=' + encodeURIComponent(file.path);
      setActive(item, file);
      if (viewer) viewer.src = url;
      currentFile.textContent = file.name + ' · texto e imágenes';
      openNew.href = url;
    }

    function actionButton(label, title, onClick) {
      const button = document.createElement('button');
      button.type = 'button';
      button.title = title;
      button.setAttribute('aria-label', title);
      button.textContent = label;
      button.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        onClick();
      });
      return button;
    }

    function extractionDir(file) {
      return file.path.replace(/\.pdf$/i, '') + '_extraido';
    }

    // Abre una vista de la tarjeta. Las de texto aseguran antes la extracción (si ya está, no repite nada).
    async function openView(file, item, view) {
      if (view !== 'pdf' && !apiEnabled) {
        return uiAlert('Para ver texto, Markdown o LaTeX abre la página con iniciar.bat y entra por http://localhost:8000.');
      }
      if (view !== 'tex' && window.closeLab) window.closeLab(); // el Taller tapa el visor: se cierra
      setActive(item, file);
      item.querySelectorAll('.card-views button').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
      const labels = { pdf: '', txt: ' · texto', md: ' · Markdown', tex: ' · LaTeX' };
      currentFile.textContent = file.name + labels[view];
      if (view === 'pdf') {
        viewer.src = pdfUrl(file.path);
        openNew.href = pdfUrl(file.path);
        return;
      }
      if (view === 'md') {
        const url = '/api/preview?path=' + encodeURIComponent(file.path);
        viewer.src = url;
        openNew.href = url;
        return;
      }
      if (view === 'txt') {
        const url = '/api/view?kind=txt&path=' + encodeURIComponent(file.path);
        viewer.src = url;
        openNew.href = url;
        return;
      }
      // LaTeX: se abre en el Taller para editarlo y compilarlo
      const r = await (await fetch('/api/extract?path=' + encodeURIComponent(file.path), { cache: 'no-store' })).json().catch(() => ({ ok: false, error: 'Servidor no disponible' }));
      if (!r.ok) return uiAlert(r.error || 'No se pudo preparar el LaTeX', 'LaTeX');
      if (window.openLabFile) window.openLabFile(extractionDir(file) + '/texto.tex');
    }

    async function showStats(file) {
      if (!apiEnabled) return uiAlert('Para contar caracteres abre la página con iniciar.bat y entra por http://localhost:8000.');
      showToast('Contando…');
      const r = await fetch('/api/stats?path=' + encodeURIComponent(file.path), { cache: 'no-store' })
        .then((x) => x.json()).catch(() => ({ ok: false, error: 'Servidor no disponible' }));
      if (!r.ok) return uiAlert(r.error || 'No se pudo contar', 'Contar caracteres');
      const fmt = (n) => (n === undefined ? '—' : n.toLocaleString('es'));
      const wrap = document.createElement('div');
      wrap.className = 'stats';
      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th></th><th>Caracteres</th><th>Sin espacios</th><th title="Letras y dígitos del contenido, sin contar las marcas de formato de Markdown y LaTeX">Letras y dígitos</th><th>Palabras</th><th>Líneas</th><th title="Letras y dígitos respecto al PDF original">Conservado</th></tr></thead>';
      const body = document.createElement('tbody');
      r.rows.forEach((row) => {
        const tr = document.createElement('tr');
        if (row.key === 'pdf') tr.className = 'orig';
        const cells = row.blocked
          ? [row.label, 'bloqueado por el antivirus']
          : [row.label, fmt(row.chars), fmt(row.nospace), fmt(row.alnum), fmt(row.words), fmt(row.lines), row.kept === undefined ? '' : row.kept + ' %'];
        cells.forEach((text, i) => {
          const td = document.createElement('td');
          td.textContent = text;
          if (row.blocked && i === 1) td.colSpan = 6;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
      table.appendChild(body);
      const note = document.createElement('p');
      note.className = 'stats-note';
      note.textContent = `${r.pages} páginas` + (r.flagged ? ` · ${r.flagged} se muestran como imagen (texto ilegible u omitido), por eso no cuentan como texto` : '') +
        '. «Letras y dígitos» no cuenta las marcas de formato de Markdown y LaTeX. Es menor que el original porque se quitan pies de página repetidos, diapositivas duplicadas y texto roto.';
      wrap.append(table, note);
      uiShow('Caracteres · ' + prettyName(file.name), wrap);
    }

    function createItem(file) {
      const kind = file.kind || 'pdf';
      const item = document.createElement('article');
      item.className = 'pdf-item' + (file.path === currentPath ? ' active' : '');
      item.dataset.search = [file.name, prettyName(file.name), file.folder].join(' ').toLowerCase();

      const top = document.createElement('div');
      top.className = 'card-top';

      const link = document.createElement('a');
      link.className = 'pdf-open';
      link.title = file.path;
      const pagesText = file.pages ? `<span>${pageLabel(file.pages)}</span>` : '';
      const garbledBadge = file.garbled ? `<span class="badge warn" title="La fuente de estas páginas está dañada en el PDF: se muestran como imagen">${file.garbled} págs. como imagen</span>` : '';
      const badge = kind === 'pdf'
        ? (file.extracted ? '<span class="badge ok">texto listo</span>'
          : failedPaths.has(file.path) ? '<span class="badge err">error al extraer</span>'
          : '<span class="badge wait">pendiente</span>') + garbledBadge
        : '';
      link.innerHTML = `
        <span class="pdf-name">${escapeHtml(prettyName(file.name).replace(/\.(md|tex)$/i, ''))}</span>
        <span class="pdf-file"><span class="file-icon ${kind}">${kind.toUpperCase()}</span>${pagesText}${badge}</span>
      `;
      top.appendChild(link);

      const tools = document.createElement('div');
      tools.className = 'card-tools';
      top.appendChild(tools);
      item.appendChild(top);

      if (kind === 'pdf') {
        link.href = pdfUrl(file.path);
        link.target = 'pdfViewer';
        link.addEventListener('click', (event) => { event.preventDefault(); openView(file, item, 'pdf'); });
        tools.appendChild(actionButton('✎', 'Renombrar', () => renameFile(file, item)));
        tools.appendChild(actionButton('↻', 'Rehacer la extracción de texto e imágenes', () => extractFile(file)));
        tools.appendChild(actionButton('📊', 'Contar caracteres: PDF original, texto, Markdown y LaTeX', () => showStats(file)));

        const views = document.createElement('div');
        views.className = 'card-views';
        [['pdf', 'PDF'], ['txt', 'Texto'], ['md', 'Markdown'], ['tex', 'LaTeX']].forEach(([view, label]) => {
          const button = actionButton(label, 'Ver en ' + label, () => openView(file, item, view));
          button.dataset.view = view;
          views.appendChild(button);
        });
        item.appendChild(views);
      } else {
        link.href = '#';
        link.addEventListener('click', (event) => {
          event.preventDefault();
          if (window.openLabFile) window.openLabFile(file.path);
        });
        tools.appendChild(actionButton('✎', 'Editar en el Taller', () => window.openLabFile && window.openLabFile(file.path)));
      }
      return item;
    }

    function createFolderNode(node) {
      const section = document.createElement('section');
      section.className = 'folder-node';
      section.dataset.path = node.path.toLowerCase();

      const toggle = document.createElement('button');
      toggle.className = 'folder-toggle';
      toggle.type = 'button';
      toggle.innerHTML = `
        <span class="folder-arrow"></span>
        <span class="folder-name">${escapeHtml(node.name)}</span>
        <span class="folder-count">${countFiles(node)}</span>
      `;
      toggle.addEventListener('click', () => {
        const key = section.dataset.path;
        if (collapsedFolders.has(key)) collapsedFolders.delete(key);
        else collapsedFolders.add(key);
        saveCollapsed();
        section.classList.toggle('collapsed');
      });

      const children = document.createElement('div');
      children.className = 'folder-children';
      renderNode(node, children);

      if (collapsedFolders.has(section.dataset.path)) section.classList.add('collapsed');
      section.appendChild(toggle);
      section.appendChild(children);
      return section;
    }

    function renderNode(node, container) {
      node.folders.forEach((child) => container.appendChild(createFolderNode(child)));
      node.files.forEach((file) => container.appendChild(createItem(file)));
    }

    function render() {
      pdfList.innerHTML = '';
      pdfList.classList.remove('searching');
      if (!configured) {
        pdfList.innerHTML = '<div class="welcome"><b>Elige tu carpeta de asignaturas.</b><br>Debe contener una carpeta por asignatura y, dentro de cada una, su temario (PDF, .tex, .md). Pulsa «Elegir carpeta…».</div>';
        empty.style.display = 'none';
        return;
      }
      renderNode(buildTree(files, folders), pdfList);
      applyFilter();
    }

    function applyFilter() {
      const query = search.value.trim().toLowerCase();
      let visible = 0;

      document.querySelectorAll('.pdf-item').forEach((item) => {
        const matches = !query || item.dataset.search.includes(query);
        item.style.display = matches ? '' : 'none';
        if (matches) visible += 1;
      });

      document.querySelectorAll('.folder-node').forEach((node) => {
        const hasVisible = Array.from(node.querySelectorAll('.pdf-item')).some((item) => item.style.display !== 'none');
        node.style.display = !query || hasVisible || node.dataset.path.includes(query) ? '' : 'none';
      });

      pdfList.classList.toggle('searching', Boolean(query));
      empty.style.display = query && visible === 0 ? 'block' : 'none';
    }

    async function loadFiles() {
      try {
        const response = await fetch('/api/files', { cache: 'no-store' });
        if (!response.ok) throw new Error('API no disponible');
        const data = await response.json();
        files = data.files || [];
        subjects = data.subjects || [];
        folders = data.folders || data.subjects || [];
        configured = data.configured !== false;
        rootPath.textContent = data.root || 'Sin carpeta';
        rootPath.title = data.root || '';
        apiEnabled = true;
        modeNotice.hidden = true;
      } catch (error) {
        files = FALLBACK_FILES;
        subjects = [];
        configured = true;
        apiEnabled = false;
        modeNotice.hidden = false;
        modeNotice.textContent = 'Modo solo lectura: ejecuta iniciar.bat y entra por http://localhost:8000 para renombrar o extraer archivos.';
      }
      render();
    }

    panelToggle.addEventListener('click', () => {
      const closed = app.classList.toggle('panel-closed');
      panelToggle.setAttribute('aria-expanded', String(!closed));
    });

    search.addEventListener('input', applyFilter);

    // Ancho de la barra lateral: se arrastra el borde y se recuerda
    (() => {
      const handle = document.getElementById('resizer');
      const DEFAULT = 420, MIN = 280;
      const apply = (w) => app.style.setProperty('--aside-w', Math.round(w) + 'px');
      try { const saved = Number(localStorage.getItem('asideWidth')); if (saved >= MIN) apply(saved); } catch (e) { /* sin almacenamiento */ }
      handle.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        app.classList.add('resizing');
        const move = (e) => apply(Math.min(Math.max(e.clientX, MIN), Math.round(window.innerWidth * 0.7)));
        const stop = () => {
          app.classList.remove('resizing');
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', stop);
          try { localStorage.setItem('asideWidth', parseInt(getComputedStyle(app).getPropertyValue('--aside-w'), 10)); } catch (e) { /* ignorar */ }
        };
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', stop);
      });
      handle.addEventListener('dblclick', () => {
        apply(DEFAULT);
        try { localStorage.removeItem('asideWidth'); } catch (e) { /* ignorar */ }
      });
    })();

    loadFiles();

    // Detecta cambios hechos fuera de la app (Explorador de Windows, etc.)
    let lastSig = null;
    async function watchFolder() {
      if (document.hidden) return;
      try {
        const res = await fetch('/api/signature', { cache: 'no-store' });
        const { sig } = await res.json();
        if (lastSig !== null && sig !== lastSig) await loadFiles();
        lastSig = sig;
      } catch (e) { /* servidor no disponible */ }
    }
    setInterval(watchFolder, 2000);

    // Progreso de la extracción automática (se hace sola en el servidor)
    const extractStatus = document.getElementById('extractStatus');
    let wasRunning = false;
    let errorsKey = '';
    let failedPaths = new Set();

    function explainError(message) {
      if (/Defender|borrado/i.test(message)) return 'Windows (Defender) ha bloqueado o borrado archivos de este PDF. Suele ser un falso positivo.';
      if (/encrypt|password|cifrad/i.test(message)) return 'El PDF está protegido con contraseña.';
      if (/corrupt|broken|damaged|cannot open|failed to open|no such file|format/i.test(message)) return 'El PDF está dañado o a medio copiar.';
      return String(message).replace(/'[A-Za-z]:[^']*'/g, 'el archivo');
    }

    function renderExtractErrors(errors) {
      const key = JSON.stringify(errors);
      extractStatus.className = 'extract-status warn failed';
      extractStatus.hidden = false;
      if (key === errorsKey && extractStatus.firstChild) return; // sin repintar si no cambió
      errorsKey = key;
      const paths = Object.keys(errors);
      failedPaths = new Set(paths);
      render();
      extractStatus.innerHTML = '<b></b><ul></ul>';
      extractStatus.firstChild.textContent = paths.length === 1
        ? 'No se pudo extraer 1 PDF'
        : `No se pudieron extraer ${paths.length} PDF`;
      const list = extractStatus.querySelector('ul');
      paths.forEach((path) => {
        const li = document.createElement('li');
        const parts = path.split('/');
        const name = document.createElement('div');
        name.className = 'fail-name';
        name.textContent = parts.pop();
        const where = document.createElement('div');
        where.className = 'fail-where';
        where.textContent = parts.join(' › ');
        const why = document.createElement('div');
        why.className = 'fail-why';
        why.textContent = explainError(errors[path]);
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.textContent = 'Reintentar';
        retry.addEventListener('click', async () => {
          retry.disabled = true;
          retry.textContent = 'Extrayendo…';
          const r = await fetch('/api/extract?force=1&path=' + encodeURIComponent(path), { cache: 'no-store' })
            .then((x) => x.json()).catch(() => ({ ok: false, error: 'Servidor no disponible' }));
          if (r.ok) { showToast('Extracción rehecha: ' + name.textContent); errorsKey = ''; loadFiles(); }
          else { retry.disabled = false; retry.textContent = 'Reintentar'; uiAlert(explainError(r.error || ''), 'No se pudo extraer ' + name.textContent); }
        });
        li.append(name, where, why, retry);
        list.appendChild(li);
      });
    }
    async function watchExtraction() {
      if (document.hidden || !apiEnabled) return;
      try {
        const s = await (await fetch('/api/extract-status', { cache: 'no-store' })).json();
        const errors = Object.keys(s.errors || {});
        if (s.running) {
          const name = (s.current || '').split('/').pop();
          extractStatus.className = 'extract-status';
          extractStatus.textContent = `Extrayendo texto e imágenes ${s.done + 1}/${s.total} · ${name}`;
          extractStatus.title = s.current || '';
          extractStatus.hidden = false;
        } else if (errors.length) {
          renderExtractErrors(s.errors);
        } else {
          extractStatus.hidden = true;
          if (failedPaths.size) { failedPaths = new Set(); errorsKey = ''; render(); }
        }
        if (wasRunning && !s.running) loadFiles();
        wasRunning = s.running;
      } catch (e) { /* servidor no disponible */ }
    }
    setInterval(watchExtraction, 1500);

    // Aviso si el servidor en marcha es más antiguo que el código en disco
    (async () => {
      try {
        const res = await fetch('/api/version', { cache: 'no-store' });
        const v = res.ok ? await res.json() : null;
        if (!v || v.started !== v.current) {
          modeNotice.hidden = false;
          modeNotice.textContent = 'El servidor en marcha es una versión antigua. Cierra la ventana de iniciar.bat, vuelve a ejecutarlo y recarga con Ctrl+F5.';
        }
      } catch (e) { /* sin servidor: ya lo indica el modo solo lectura */ }
    })();
    document.addEventListener('visibilitychange', watchFolder);
  </script>
  <script src="ui.js"></script>
  <script src="lab.js"></script>
</body>
</html>
